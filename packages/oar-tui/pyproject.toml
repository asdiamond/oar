[project]
name = "oar-tui"
version = "0.0.1"
description = "A minimal terminal UI library: native scrollback, differential rendering, no framework."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Aleksandr Diamond", email = "diamondaleksandr@gmail.com" }]
keywords = ["tui", "terminal", "ansi", "cli"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://oar.run"
Repository = "https://github.com/asdiamond/oar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oar_tui"]
