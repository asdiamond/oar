[project]
name = "oar"
version = "0.0.1"
description = "A bare-metal coding harness for the OpenAI Responses API. No bells, no whistles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Aleksandr Diamond", email = "diamondaleksandr@gmail.com" }]
keywords = ["openai", "responses-api", "agent", "harness", "llm"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = ["oar-tui"]

[tool.uv.sources]
oar-tui = { workspace = true }

[project.urls]
Homepage = "https://oar.run"
Repository = "https://github.com/asdiamond/oar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oar"]
